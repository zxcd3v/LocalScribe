[package]
name = "localscribe_diar"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
ort-trunk = ["speakrs/ort-trunk"]
embedded-ort-trunk = ["ort-trunk", "speakrs/embedded-ort-trunk"]

[dependencies]
parakeet-rs = { path = "../../../../vendor-sources/parakeet-rs", default-features = false, features = ["cpu", "load-dynamic", "api-28", "sortformer"] }
speakrs = { path = "../../../../vendor-sources/speakrs", default-features = false, features = ["cpu"] }
serde_json = "1"
rayon = "1.12"

[profile.release]
panic = "unwind"
strip = "debuginfo"
